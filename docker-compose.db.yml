# Ścieżka A: tylko Postgres (runtime + baza testowa). Wejście: `pnpm db:up`.
# Atomy POSTGRES_* z root `.env`. Nie mylić ze ścieżką B (`docker-compose.dev.yml`).
services:
  postgres:
    image: postgres:16-alpine
    container_name: vinseo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_DB_TEST: ${POSTGRES_DB_TEST:?POSTGRES_DB_TEST is required}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - vinseo_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/01-init-test-db.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vinseo_pg_data:
